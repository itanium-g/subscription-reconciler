services:
  postgres:
    image: postgres:18.4-alpine
    container_name: subscription-reconciler_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: subscription_reconciler
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    container_name: subscription-reconciler_api
    environment:
      DATABASE_URL: "postgres://postgres:postgres@postgres:5432/subscription_reconciler?sslmode=disable"
      PORT: "8080"
      LOG_LEVEL: "info"
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: /app/api
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    container_name: subscription-reconciler_worker
    environment:
      DATABASE_URL: "postgres://postgres:postgres@postgres:5432/subscription_reconciler?sslmode=disable"
      LOG_LEVEL: "info"
      CARRIER_API_URL: "http://mock-carrier:8081"
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: /app/worker

  mock-carrier:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    container_name: subscription-reconciler_mock_carrier
    environment:
      DATABASE_URL: "postgres://postgres:postgres@postgres:5432/subscription_reconciler?sslmode=disable"
      PORT: "8081"
      LOG_LEVEL: "info"
      MOCK_CARRIER_MODE: "true"
    ports:
      - "8081:8081"
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: /app/api

  migrate:
    image: migrate/migrate:v4.18.2
    container_name: subscription-reconciler_migrate
    volumes:
      - ./migrations:/migrations
    command: -path=/migrations -database="postgres://postgres:postgres@postgres:5432/subscription_reconciler?sslmode=disable" up
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
